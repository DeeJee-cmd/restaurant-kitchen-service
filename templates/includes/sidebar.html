<div class="d-flex flex-column flex-shrink-0 p-3 bg-white border-end h-100">
  <a href="{% url 'index' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-dark text-decoration-none">
    <i class="bi bi-cup-hot-fill fs-4 me-2 text-primary"></i>
    <span class="fs-4 fw-bold">Restaurant</span>
  </a>
  <hr>

  <ul class="nav nav-pills flex-column mb-auto">
    <li class="nav-item">
      <a href="{% url 'index' %}" class="nav-link text-dark">
        <i class="bi bi-house-door me-2"></i> Home
      </a>
    </li>
    <li>
      <a href="{% url 'cooks:cook-list' %}" class="nav-link text-dark">
        <i class="bi bi-people me-2"></i> All cooks
      </a>
    </li>
    <li>
      <a href="{% url 'dishes:dish-list' %}" class="nav-link text-dark">
        <i class="bi bi-journal-richtext me-2"></i> All dishes
      </a>
    </li>
    <li>
      <a href="{% url 'dish_types:dish-type-list' %}" class="nav-link text-dark">
        <i class="bi bi-tags me-2"></i> All dish types
      </a>
    </li>
  </ul>

  <hr>

  <div class="user-profile">
    {% if user.is_authenticated %}
      <div class="mb-2">
        <span class="text-muted small">User:</span>
        <a href="{{ user.get_absolute_url }}" class="fw-bold text-dark text-decoration-none d-block">
          {{ user.get_username }}
        </a>
      </div>
      <form method="post" action="{% url 'logout' %}?next=/">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-danger btn-sm w-100">
          <i class="bi bi-box-arrow-right me-1"></i> Log Out
        </button>
      </form>
    {% else %}
      <a href="{% url 'login' %}?next={{ request.path }}" class="btn btn-primary btn-sm w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i> Login
      </a>
    {% endif %}
  </div>
</div>
