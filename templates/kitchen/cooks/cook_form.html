{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block title %}
<title>{{ object|yesno:"Update,Create" }} Cook - Restaurant</title>
{% endblock %}

{% block content %}
<div class="container-fluid" style="max-width: 600px;">
  
  <div class="card shadow-sm border-0 p-4">
    <h1 class="h3 fw-bold mb-4">{{ object|yesno:"Update,Create" }} Cook</h1>

    <form action="" method="post" novalidate>
      {% csrf_token %}
      {{ form|crispy }}

      <div class="d-flex justify-content-between align-items-center mt-4">
        <a href="{% url 'cooks:cook-list' %}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary px-4">Submit</button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
