{% extends "base.html" %}

{% block title %}
<title>Delete Dish - Restaurant</title>
{% endblock %}

{% block content %}
<div class="container-fluid d-flex justify-content-center align-items-center mt-5">
  
  <div class="card shadow-sm border-0 p-4 text-center" style="max-width: 450px; width: 100%;">
    <div class="text-danger mb-3">
      <i class="bi bi-exclamation-triangle display-4"></i>
    </div>
    
    <h1 class="h4 fw-bold mb-3">Delete Dish</h1>
    <p class="text-muted mb-4">
      Are you sure you want to delete dish: <strong class="text-dark">{{ dish }}</strong>?
    </p>

    <form action="" method="post" class="d-flex justify-content-center gap-2">
      {% csrf_token %}
      <a href="{% url 'dishes:dish-list' %}" class="btn btn-secondary px-4">Cancel</a>
      <button type="submit" class="btn btn-danger px-4">Yes, delete</button>
    </form>
  </div>

</div>
{% endblock %}
